<div [attr.dir]="isRtl ? 'rtl' : 'ltr'"
     class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between font-sans selection:bg-indigo-500 selection:text-white p-4 sm:p-6">

  <!-- Top Bar: Logo & Language Selector -->
  <header class="w-full max-w-7xl mx-auto flex items-center justify-between py-4">
    <!-- Brand Logo -->
    <div class="flex items-center gap-3 cursor-pointer" routerLink="/">
      <svg class="w-8 h-8 text-white transition-transform hover:rotate-45 duration-300" viewBox="0 0 500 500" fill="currentColor">
        <path d="M 250 0 A 250 250 0 0 0 98.7 65.4 L 175.7 219.4 L 284 0 H 250 Z M 30 148 A 250 250 0 0 0 0 250 A 250 250 0 0 0 13.9 331.3 L 180 295.5 L 30 148 Z M 401.3 434.6 A 250 250 0 0 0 500 250 A 250 250 0 0 0 486.1 168.7 L 320 204.5 L 401.3 434.6 Z M 216 500 L 324.3 280.6 L 250 500 A 250 250 0 0 0 401.3 434.6 L 216 500 Z M 0 250 H 216 L 98.7 65.4 A 250 250 0 0 0 0 250 Z M 284 0 H 500 A 250 250 0 0 0 401.3 65.4 L 284 0 Z"/>
      </svg>
      <span class="text-xl font-bold tracking-wider uppercase text-white">Momentum</span>
    </div>

    <!-- Language Selector Buttons -->
    <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-lg text-xs font-semibold">
      <button
        (click)="changeLanguage('en')"
        [class.bg-slate-800]="currentLang === 'en'"
        [class.text-white]="currentLang === 'en'"
        class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition-all">
        EN
      </button>
      <button
        (click)="changeLanguage('fr')"
        [class.bg-slate-800]="currentLang === 'fr'"
        [class.text-white]="currentLang === 'fr'"
        class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition-all">
        FR
      </button>
      <button
        (click)="changeLanguage('ar')"
        [class.bg-slate-800]="currentLang === 'ar'"
        [class.text-white]="currentLang === 'ar'"
        class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition-all">
        العربية
      </button>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="w-full max-w-md mx-auto my-auto">
    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">

      <!-- Card Header -->
      <div class="text-center mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">{{ t.title }}</h1>
        <p class="text-xs sm:text-sm text-slate-400">{{ t.subtitle }}</p>
      </div>

      <!-- Google OAuth Button -->
      <button
        type="button"
        (click)="loginWithGoogle()"
        class="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl px-4 py-3 font-medium text-sm transition-all duration-200 shadow-sm hover:shadow">
        <!-- Google SVG Icon -->
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9c-.4-.7-.9-2.2-.9-4z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
        </svg>
        <span>{{ t.googleBtn }}</span>
      </button>

      <!-- Divider -->
      <div class="relative my-6 flex items-center justify-center">
        <div class="w-full border-t border-slate-800"></div>
        <span class="absolute bg-slate-900 px-3 text-xs text-slate-500 uppercase tracking-wider font-medium">
          {{ t.orContinueWith }}
        </span>
      </div>

      <!-- Credentials Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Email Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">{{ t.emailLabel }}</label>
          <input
            type="email"
            formControlName="email"
            [placeholder]="t.emailPlaceholder"
            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition-all" />
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">{{ t.passwordLabel }}</label>
          <input
            type="password"
            formControlName="password"
            [placeholder]="t.passwordPlaceholder"
            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition-all" />
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
            <input
              type="checkbox"
              formControlName="rememberMe"
              class="rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-950" />
            <span>{{ t.rememberMe }}</span>
          </label>
          <a href="#" class="text-slate-400 hover:text-white font-medium transition-colors">{{ t.forgotPassword }}</a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full bg-white hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed text-slate-950 font-semibold rounded-xl px-4 py-3 text-sm transition-all duration-200 shadow-lg shadow-white/5">
          {{ t.signInBtn }}
        </button>
      </form>

      <!-- Footer / Sign Up Switch -->
      <div class="mt-6 text-center text-xs text-slate-400">
        <span>{{ t.noAccount }} </span>
        <a href="#" class="text-white font-semibold hover:underline ml-1">{{ t.signUp }}</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-7xl mx-auto py-4 text-center text-xs text-slate-600">
    &copy; 2026 Momentum. All rights reserved.
  </footer>

</div>
