<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header / Navigation -->
  <header class="w-full max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
    <!-- Logo & Brand Name -->
    <div class="flex items-center gap-3 cursor-pointer" (click)="goToHome()">
      <!-- Inlined SVG styled to match your logo image -->
      <svg class="w-9 h-9 text-white transition-transform hover:rotate-45 duration-300" viewBox="0 0 500 500" fill="currentColor">
        <path d="M 250 0 A 250 250 0 0 0 98.7 65.4 L 175.7 219.4 L 284 0 H 250 Z M 30 148 A 250 250 0 0 0 0 250 A 250 250 0 0 0 13.9 331.3 L 180 295.5 L 30 148 Z M 401.3 434.6 A 250 250 0 0 0 500 250 A 250 250 0 0 0 486.1 168.7 L 320 204.5 L 401.3 434.6 Z M 216 500 L 324.3 280.6 L 250 500 A 250 250 0 0 0 401.3 434.6 L 216 500 Z M 0 250 H 216 L 98.7 65.4 A 250 250 0 0 0 0 250 Z M 284 0 H 500 A 250 250 0 0 0 401.3 65.4 L 284 0 Z"/>
      </svg>
      <span class="text-2xl font-bold tracking-wider uppercase text-white">Momentum</span>
    </div>

    <!-- Right Action: Sign In Button -->
    <div class="flex items-center gap-4">
      <button
        (click)="goToSignIn()"
        class="px-5 py-2.5 rounded-lg text-sm font-semibold text-slate-200 hover:text-white hover:bg-slate-800 border border-slate-700 hover:border-slate-500 transition-all duration-200">
        Sign In
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="flex-1 flex flex-col justify-center items-center px-6 text-center max-w-4xl mx-auto -mt-10">
    <!-- Tagline Badge -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs font-medium text-slate-400 mb-8">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      Project Management Redefined
    </div>

    <!-- Main Heading -->
    <h1 class="text-5xl sm:text-6xl font-extrabold tracking-tight text-white mb-6 leading-tight">
      Keep your workflow in constant <span class="bg-gradient-to-r from-slate-100 via-slate-300 to-slate-500 bg-clip-text text-transparent">Momentum</span>
    </h1>

    <!-- Subtitle -->
    <p class="text-lg sm:text-xl text-slate-400 max-w-2xl mb-10 leading-relaxed">
      Empower your team with clean, distraction-free project execution. Track progress, remove bottlenecks, and ship faster.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
      <button
        (click)="goToSignIn()"
        class="px-8 py-3.5 rounded-xl text-base font-semibold text-slate-950 bg-white hover:bg-slate-200 shadow-lg shadow-white/10 transition-all duration-200 transform hover:-translate-y-0.5">
        Get Started
      </button>
      <button
        (click)="goToSignIn()"
        class="px-8 py-3.5 rounded-xl text-base font-semibold text-white bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition-all duration-200">
        Sign In to Account
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-7xl mx-auto px-6 py-8 border-t border-slate-900 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-4">
    <p>&copy; 2026 Momentum Inc. All rights reserved.</p>
    <div class="flex gap-6">
      <a href="#" class="hover:text-slate-300 transition-colors">Privacy Policy</a>
      <a href="#" class="hover:text-slate-300 transition-colors">Terms of Service</a>
      <a href="#" class="hover:text-slate-300 transition-colors">Contact Support</a>
    </div>
  </footer>

</div>
